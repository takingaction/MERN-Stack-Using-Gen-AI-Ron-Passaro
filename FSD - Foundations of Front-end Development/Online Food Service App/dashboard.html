<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <nav
      class="bg-orange-500 text-white flex items-center justify-between px-8 py-4 shadow-md"
    >
      <h1 class="text-xl font-bold">My Food App</h1>
      <div class="flex items-center gap-6">
        <span id="userEmail" class="text-sm"></span>
        <span id="cartCount" class="text-sm font-semibold"></span>
      </div>
      <div class="flex gap-2">
        <input
          type="button"
          value="Food"
          onclick="showFoodSelection()"
          class="bg-white text-orange-500 font-bold py-1 px-4 rounded cursor-pointer hover:bg-orange-100"
        />
        <input
          type="button"
          value="Cart"
          onclick="showCartSelection()"
          class="bg-white text-orange-500 font-bold py-1 px-4 rounded cursor-pointer hover:bg-orange-100"
        />
        <input
          type="button"
          value="Checkout"
          onclick="checkOut()"
          class="bg-white text-orange-500 font-bold py-1 px-4 rounded cursor-pointer hover:bg-orange-100"
        />
        <input
          type="button"
          value="Logout"
          onclick="logout()"
          class="bg-orange-700 text-white font-bold py-1 px-4 rounded cursor-pointer hover:bg-orange-800"
        />
      </div>
    </nav>

    <section
      id="foodSelection"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 p-10"
    ></section>

    <section
      id="cartSelection"
      class="max-w-2xl mx-auto mt-10 bg-white rounded-lg shadow-md p-6"
    >
      <h2 class="text-xl font-bold mb-4 border-b pb-2">Shopping Cart</h2>
      <div id="cartItem"></div>
    </section>

    <script src="js/dashboard.js"></script>
  </body>
</html>
